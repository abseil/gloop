edition = "2023";

package util;

import "google/protobuf/any.proto";
import "google/protobuf/bridge/message_set.proto";

option java_package = "com.google.net.util";

// This type is not meant for public use, but only for storing the new
// non-MessageSet payloads in `Status` in `MessageSet` for compatibility with
// the existing `StatusProto` so these payloads are not lost.
message NonMessageSetPayload {
  extend google.protobuf.bridge.MessageSet {
    NonMessageSetPayload message_set_extension = 258191113;
  }

  repeated google.protobuf.Any payloads = 1;
}
