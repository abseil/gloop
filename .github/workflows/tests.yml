name: Tests

on:
  # continuous
  schedule:
    # Run every hour
    - cron: "0 * * * *"

  # postsubmit
  push:
    branches:
      - main

  # presubmit
  pull_request:
    branches:
      - main

  # manual
  workflow_dispatch:

permissions:
  contents: read

# Avoid running twice at the same time over the same changes.
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request", "workflow_dispatch", "schedule"]'), github.event_name) }}

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux (${{ matrix.config }})
    container:
      image: gcr.io/google.com/absl-177019/gloop-linux-latest@sha256:f51b87a65f323231dcb0003079367e91291a3e0b7f91dc43a39e84c614bd73eb
      # Our images happen to be public today, but use our service account's credentials anyway in
      # case we decide to lock down access.
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_SERVICE_ACCOUNT }}
    strategy:
      fail-fast: false   # Don't cancel all jobs if one fails.
      matrix:
        config: [opt, dbg, asan, ubsan, msan, tsan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          bazelisk-cache: true
          cache-save: true
          external-cache: true
          repository-cache: |
            - MODULE.bazel
          google-credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
          bazelrc: common --remote_cache=https://storage.googleapis.com/gloop-bazel-remote-cache

      - name: Run tests
        run: bazel test ... --config=${{ matrix.config }}

  all-blocking-tests:
    name: All Blocking Tests
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: "${{ !contains(join(needs.*.result, ' '), 'failure') && !contains(join(needs.*.result, ' '), 'cancelled') }}"
    # This workflow must run even if one or more of the dependent workflows
    # failed.
    if: always()
