name: Tests

on:
  # continuous
  schedule:
    # Run every hour
    - cron: "0 * * * *"

  # postsubmit
  push:
    branches:
      - main

  # presubmit
  pull_request:
    branches:
      - main

  # manual
  workflow_dispatch:

permissions:
  contents: read

# Avoid running twice at the same time over the same changes.
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request", "workflow_dispatch", "schedule"]'), github.event_name) }}

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux
    container:
      image: gcr.io/google.com/absl-177019/linux_hybrid-latest:20260131
      env:
        BAZEL_CXXOPTS: -std=c++20
    steps:
      - name: Find cached bazel versions
        run: cat /root/cached_bazel_versions
      - name: Disk Free before checkout
        run: df -h
      - name: Checkout
        uses: actions/checkout@v4
      - name: Disk Free after checkout
        run: df -h
      - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          bazelisk-cache: true
          # Github cache is limited to 10GB, don't write for pull requests.
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: true
          external-cache: true
          repository-cache: |
            - MODULE.bazel
      - name: Disk Free before bazel
        run: df -h
      - name: Run tests
        run: bazel test ...
