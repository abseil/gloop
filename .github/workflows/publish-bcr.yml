name: Publish to BCR

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to publish to BCR (e.g. 20260826.rc1 or 20260826.0)'
        required: false
        type: string
      registry_fork:
        description: 'Fork of bazel-central-registry to push to (default: abseil/bazel-central-registry)'
        required: false
        default: 'abseil/bazel-central-registry'
        type: string
    secrets:
      publish_token:
        description: 'GitHub token or personal access token with permissions to push to registry fork'
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish to BCR (e.g. 20260826.rc1 or 20260826.0)'
        required: true
        type: string
      registry_fork:
        description: 'Fork of bazel-central-registry to push to (default: abseil/bazel-central-registry)'
        required: false
        default: 'abseil/bazel-central-registry'
        type: string

jobs:
  bcr:
    name: Publish Module to Bazel Central Registry
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@ca23149e55cd4db07a6bcce69c02dea314c5a357 # v1.5.0
    with:
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
      registry_fork: ${{ inputs.registry_fork || 'abseil/bazel-central-registry' }}
      attest: false
      draft: false
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}

  summary:
    name: Surface BCR PR Summary
    needs: [bcr]
    if: always() && needs.bcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Surface BCR PR Summary
        env:
          GH_TOKEN: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN || github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
          REGISTRY_FORK: ${{ inputs.registry_fork || 'abseil/bazel-central-registry' }}
        run: |
          set -euo pipefail

          FORK_OWNER="${REGISTRY_FORK%%/*}"
          HEAD="${FORK_OWNER}:gloop-${TAG_NAME}"
          QUERY="q=is%3Apr+gloop+${TAG_NAME}"
          FALLBACK_URL="https://github.com/bazelbuild/bazel-central-registry/pulls?${QUERY}"

          PR_URL=$(gh api "repos/bazelbuild/bazel-central-registry/pulls?head=${HEAD}&state=all" --jq '.[0].html_url // empty' 2>/dev/null || true)
          URL="${PR_URL:-$FALLBACK_URL}"
          echo "::notice title=BCR Pull Request::${URL}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Bazel Central Registry (BCR) Publication

          | Property | Value |
          | :--- | :--- |
          | **Release Tag** | \`${TAG_NAME}\` |
          | **Registry Fork** | [\`${REGISTRY_FORK}\`](https://github.com/${REGISTRY_FORK}) |
          | **BCR Pull Request** | [${URL}](${URL}) |

          ✨ Publication completed:
          👉 **[View BCR Pull Request](${URL})**
          EOF

